submission:
  title: "GridWatch AI — Predictive Power Grid Risk Engine"  # REQUIRED

  problem_statement: >                              # REQUIRED
    Grid operators lack real-time predictive visibility into transformer health
    across transmission networks. Current monitoring is reactive, fragmented
    across SCADA/weather/incident silos, and relies on subjective engineer
    judgment — leading to unplanned outages costing $100K+/hour and cascading
    failure risk from aging infrastructure (70% of US transformers >25 years old).

  solution_summary: >                               # REQUIRED
    GridWatch AI fuses live SCADA telemetry, multi-zone weather, and incident
    history into a deterministic risk engine that computes an Asset Health Index
    (AHI) for 20 transformers every 60 seconds. It outputs failure probability,
    risk tiers (Critical/High/Medium/Low), time-to-failure estimates, and
    prioritized dispatcher action plans with crew deployments — all via a
    modern React dashboard and FastAPI backend with zero external ML dependencies.

  key_features:                                     # REQUIRED
    - "Real-time Asset Health Index (AHI) from thermal, electrical, mechanical, and environmental stress fusion"
    - "Failure probability & risk tier classification (Critical/High/Medium/Low) with time-to-failure estimates"
    - "Prioritized dispatcher action plans (Immediate > Urgent > Medium) with crew assignments and parts kits"
    - "Executive operator brief with grid status (NOMINAL/ELEVATED_RISK/CRITICAL_ALERT) and natural-language summary"
    - "Interactive Risk Map (Leaflet), Fleet table, telemetry charts (Recharts), and incident timelines"

  tech_stack:
    languages: ["Python", "TypeScript"]              # REQUIRED
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS"]  # REQUIRED
    ibm_technologies: ["watsonx.ai (architecture-ready)", "IBM Bob (MCP-compatible API design)"]  # IBM tech
    databases: ["SQLite (SQLAlchemy 2.0)"]           # REQUIRED
    other: ["Leaflet", "Recharts", "Axios", "Pydantic v2", "Uvicorn"]  # REQUIRED

  what_we_are_most_proud_of: >                      # Optional but recommended
    A fully deterministic, explainable risk engine that produces auditable
    Asset Health Scores without black-box ML — critical for regulated utility
    environments. The engine computes 4 stress dimensions from raw physics
    telemetry (load, oil temp, voltage, vibration, weather) into a single
    0-100 health index with named primary risk factors, enabling operators
    to trust and act on every recommendation. Zero external API dependencies
    means judges can run it locally in 2 commands with a pre-seeded 30-day
    dataset including 3 critical assets (TX-114, TX-107, TX-119).

  known_limitations: >                              # Optional but recommended
    - No authentication/authorization (login page is branded landing only)
    - SQLite limits concurrent writes; production needs PostgreSQL
    - Risk model weights are heuristic, not calibrated on historical failure data
    - No real-time WebSocket push — uses 60-second polling
    - Weather data is synthetic/seeded; no live weather API integration
    - Single-page login — no user session management

